spring.application.name=MarketingAgent
spring.datasource.url=jdbc:h2:file:./data/marketing-agent
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/comment-prompt.sql,classpath:db/api-usage.sql,classpath:db/video-analysis.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# bootRun starts in backend/ and IntelliJ may start at the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
agent.ai.api-key=${OPENAI_API_KEY:}
agent.youtube.api-key=${YOUTUBE_API_KEY:}
