spring.application.name=MarketingAgent
spring.datasource.url=jdbc:h2:file:./data/marketing-agent
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/comment-prompt.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# backend/.env uses Java properties syntax; OS environment variables take priority.
spring.config.import=optional:file:./.env[.properties]
agent.ai.api-key=${OPENAI_API_KEY:}
agent.youtube.api-key=${YOUTUBE_API_KEY:}
