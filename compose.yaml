services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: marketing_agent
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marketing_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketing_db:
